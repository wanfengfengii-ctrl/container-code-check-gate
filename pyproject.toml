[project]
name = "container-check-api"
version = "1.0.0"
description = "闸口集装箱箱号校验位批量复算 API（FastAPI + Pydantic）"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn[standard]==0.52.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
